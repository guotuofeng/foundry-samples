# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: resilient-workflow
services:
  ai-project:
    host: azure.ai.project
  resilient-workflow:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Framework
        - Resilient Background
        - Workflows
    project: src/resilient-workflow
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: resilient-workflow.dll
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: resilient-workflow
    displayName: Resilient Background Workflow
    description: A deterministic long-running workflow that intentionally terminates its hosted process and resumes from a durable checkpoint in the replacement process.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      ENABLE_CRASH_RECOVERY_DEMO: ${ENABLE_CRASH_RECOVERY_DEMO=true}
      LONG_RUNNING_DELAY_SECONDS: ${LONG_RUNNING_DELAY_SECONDS=20}
      CRASH_DELAY_SECONDS: ${CRASH_DELAY_SECONDS=3}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
